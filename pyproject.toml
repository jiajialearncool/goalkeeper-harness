[project]
name = "goalkeeper-harness"
version = "0.1.0"
description = "Independent long-running task harness and frozen comparative evaluation"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
  "pydantic>=2.9,<3", "pyjwt[crypto]>=2.9,<3", "keyring>=25,<26",
  "tiktoken>=0.9,<1", "numpy>=2,<3", "scipy>=1.14,<2",
  "openpyxl>=3.1,<4", "python-pptx>=1,<2", "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.9,<1"]

[project.scripts]
goalkeeper = "goalkeeper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/goalkeeper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
